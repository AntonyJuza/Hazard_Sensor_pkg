/**:
  ros__parameters:

    # ── Ultrasonic GPIO ───────────────────────────────────────────────────────
    front_trig: 5
    front_echo: 6
    front_left_trig: 16
    front_left_echo: 26
    front_right_trig: 24
    front_right_echo: 23
    publish_rate_hz: 10.0

    # ── Front thresholds ──────────────────────────────────────────────────────
    danger_dist_cm: 25.0
    caution_dist_cm: 50.0

    # ── Side thresholds ───────────────────────────────────────────────────────
    side_clear_dist_cm: 80.0
    side_warn_dist_cm: 40.0

    # ── Fire ──────────────────────────────────────────────────────────────────
    fire_stop_dist_cm: 20.0

    # ── Human Approach (NEW) ──────────────────────────────────────────────────
    human_stop_dist_cm: 30.0     # Stop 30cm from human (safer than fire)
    human_forward_speed: 0.08    # m/s — cautious approach
    human_turn_speed: 0.7        # rad/s — slower turn toward human

    # ── Speed ─────────────────────────────────────────────────────────────────
    forward_speed: 0.13
    turn_speed: 1.0
    wheel_base: 0.235

    # ── Turn hold ─────────────────────────────────────────────────────────────
    turn_hold_s: 0.5

    # ── IMU ───────────────────────────────────────────────────────────────────
    imu_topic: "/imu/mpu6050"
    heading_kp: 0.10
    heading_deadband: 0.02
    stuck_timeout_s: 2.5

    # ── Recovery Scan ─────────────────────────────────────────────────────────
    scan_clear_dist_cm: 40.0
    scan_angle_deg: 90.0
    scan_turn_speed: 0.9
    scan_hold_s: 0.4
    both_blocked_dist_cm: 35.0

    # ── Loop rate ─────────────────────────────────────────────────────────────
    loop_rate_hz: 10.0
